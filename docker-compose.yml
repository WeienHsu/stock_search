services:
  api:
    build: .
    image: stock-intelligence:latest
    container_name: stock_intelligence
    restart: unless-stopped
    ports:
      - "8700:8700"
    env_file:
      - .env
    volumes:
      # One shared runtime volume keeps alerts.db, users.db, and caches together.
      - stock_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    image: stock-intelligence:latest
    container_name: stock_intelligence_worker
    restart: unless-stopped
    command: ["python", "-m", "src.scheduler.worker"]
    healthcheck:
      disable: true
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - stock_data:/app/data

volumes:
  stock_data:
    driver: local
